# Starship prompt configuration.
"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
command_timeout = 500
continuation_prompt = "[∙](bright-black) "
custom = {}
format = "$git_branch$git_state$git_status$nix$nix_shell$username$directory$character"
right_format = ""
scan_timeout = 30

[aws]
disabled = false
expiration_symbol = "X"
force_display = false
format = "[$symbol($profile )(($region) )([$duration] )]($style)"
profile_aliases = {}
region_aliases = {}
style = "bold yellow"
symbol = "🅰 "

[azure]
disabled = true
format = "[$symbol($subscription)([$duration])]($style) "
style = "blue bold"
symbol = "ﴃ "

[battery]
charging_symbol = " "
disabled = false
discharging_symbol = " "
display = [{ style = "red bold", threshold = 10 }]
empty_symbol = " "
format = "[$symbol$percentage]($style) "
full_symbol = " "
unknown_symbol = " "

[buf]
detect_extensions = []
detect_files = ["buf.yaml","buf.gen.yaml","buf.work.yaml"]
detect_folders = []
disabled = false
format = "[$symbol ($version)]($style)"
style = "bold blue"
symbol = ""
version_format = "v$raw"

[c]
commands = [["cc","--version"],["gcc","--version"],["clang","--version"]]
detect_extensions = ["c","h"]
detect_files = []
detect_folders = []
disabled = false
format = "[$symbol($version(-$name) )]($style)"
style = "fg:149 bold bg:0x86BBD8"
symbol = " "
version_format = "v$raw"

[character]
disabled = false
error_symbol = "[✗](bold red) "
format = "$symbol "
success_symbol = "[➜](bold green) "
vicmd_symbol = "[❮](bold green)"

[cmake]
detect_extensions = []
detect_files = ["CMakeLists.txt","CMakeCache.txt"]
detect_folders = []
disabled = false
format = "[$symbol($version )]($style)"
style = "bold blue"
symbol = "△ "
version_format = "v$raw"

[cmd_duration]
disabled = false
format = "⏱ [$duration]($style) "
min_time = 2000
min_time_to_notify = 45000
show_milliseconds = false
show_notifications = false
style = "yellow bold"

[cobol]
detect_extensions = ["cbl","cob","CBL","COB"]
detect_files = []
detect_folders = []
disabled = false
format = "[$symbol($version )]($style)"
style = "bold blue"
symbol = "⚙️ "
version_format = "v$raw"

[conda]
disabled = false
format = "[$symbol$environment]($style) "
ignore_base = true
style = "green bold"
symbol = " "
truncation_length = 1

[container]
disabled = false
format = "[$symbol [$name]]($style) "
style = "red bold dimmed"
symbol = "⬢"

[crystal]
detect_extensions = ["cr"]
detect_files = ["shard.yml"]
detect_folders = []
disabled = false
format = "[$symbol($version )]($style)"
style = "bold red"
symbol = "🔮 "
version_format = "v$raw"

[dart]
detect_extensions = ["dart"]
detect_files = ["pubspec.yaml","pubspec.yml","pubspec.lock"]
detect_folders = [".dart_tool"]
disabled = false
format = "[$symbol($version )]($style)"
style = "bold blue"
symbol = "🎯 "
version_format = "v$raw"

[deno]
detect_extensions = []
detect_files = ["deno.json","deno.jsonc","mod.ts","deps.ts","mod.js","deps.js"]
detect_folders = []
disabled = false
format = "[$symbol($version )]($style)"
style = "green bold"
symbol = "🦕 "
version_format = "v$raw"

[directory]
disabled = false
fish_style_pwd_dir_length = 0
format = "[$path]($style)[$read_only]($read_only_style) "
home_symbol = "~"
read_only = " "
read_only_style = "red"
repo_root_format = "[$before_root_path]($style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
style = "cyan bold bg:0xDA627D"
truncate_to_repo = true
truncation_length = 3
truncation_symbol = "…/"
use_logical_path = true
use_os_path_sep = true

[directory.substitutions]
Documents = " "
Downloads = " "
"Important " = " "
Music = " "
Pictures = " "

[docker_context]
detect_extensions = []
detect_files = ["docker-compose.yml","docker-compose.yaml","Dockerfile"]
detect_folders = []
disabled = false
format = "[$symbol$context]($style) "
only_with_files = true
style = "blue bold bg:0x06969A"
symbol = " "

[dotnet]
detect_extensions = ["csproj","fsproj","xproj"]
detect_files = ["global.json","project.json","Directory.Build.props","Directory.Build.targets","Packages.props"]
detect_folders = []
disabled = false
format = "[$symbol($version )(🎯 $tfm )]($style)"
heuristic = true
style = "blue bold"
symbol = "🥅 "
version_format = "v$raw"

[elixir]
detect_extensions = []
detect_files = ["mix.exs"]
detect_folders = []
disabled = false
format = "[$symbol($version (OTP $otp_version) )]($style)"
style = "bold purple bg:0x86BBD8"
symbol = " "
version_format = "v$raw"

[elm]
detect_extensions = ["elm"]
detect_files = ["elm.json","elm-package.json",".elm-version"]
detect_folders = ["elm-stuff"]
disabled = false
format = "[$symbol($version )]($style)"
style = "cyan bold bg:0x86BBD8"
symbol = " "
version_format = "v$raw"

[env_var]

[env_var.SHELL]
default = "unknown shell"
disabled = true
format = "[$symbol($env_value )]($style)"
style = "grey bold italic dimmed"
symbol = "e:"
variable = "SHELL"

[env_var.USER]
default = "unknown user"
disabled = true
format = "[$symbol($env_value )]($style)"
style = "grey bold italic dimmed"
symbol = "e:"

[erlang]
detect_extensions = []
detect_files = ["rebar.config","erlang.mk"]
detect_folders = []
disabled = false
format = "[$symbol($version )]($style)"
style = "bold red"
symbol = " "
version_format = "v$raw"

[fill]
disabled = false
style = "bold black"
symbol = "."

[gcloud]
disabled = false
format = "[$symbol$account(@$domain)(($region))(($project))]($style) "
project_aliases = {}
region_aliases = {}
style = "bold blue"
symbol = "☁️ "

[git_branch]
always_show_remote = false
disabled = false
format = "[$symbol$branch(:$remote_branch)]($style) "
ignore_branches = []
only_attached = false
style = "bold purple bg:0xFCA17D"
symbol = " "
truncation_length = 9223372036854775807
truncation_symbol = "…"

[git_commit]
commit_hash_length = 7
disabled = false
format = "[($hash$tag)]($style) "
only_detached = true
style = "green bold"
tag_disabled = true
tag_symbol = " 🏷  "

[git_metrics]
added_style = "bold green"
deleted_style = "bold red"
disabled = false
format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"
only_nonzero_diffs = true

[git_state]
am = "AM"
am_or_rebase = "AM/REBASE"
bisect = "BISECTING"
cherry_pick = "🍒PICKING(bold red)"
disabled = false
format = "([$state( $progress_current/$progress_total)]($style)) "
merge = "MERGING"
rebase = "REBASING"
revert = "REVERTING"
style = "bold yellow"

[git_status]
ahead = "💨$count"
behind = "😰$count"
conflicted = ""
deleted = ""
disabled = false
diverged = "😵"
ignore_submodules = false
modified = "📝"
renamed = "👅"
staged = "[++($count)](green)"
stashed = ""
style = "red bold bg:0xFCA17D"
untracked = "🤷"
up_to_date = "✓"

[golang]
detect_extensions = ["go"]
detect_files = ["go.mod","go.sum","glide.yaml","Gopkg.yml","Gopkg.lock",".go-version"]
detect_folders = ["Godeps"]
disabled = false
format = "[$symbol($version )]($style)"
style = "bold cyan bg:0x86BBD8"
symbol = " "
version_format = "v$raw"

[haskell]
detect_extensions = ["hs","cabal","hs-boot"]
detect_files = ["stack.yaml","cabal.project"]
detect_folders = []
disabled = false
format = "[$symbol($version )]($style)"
style = "bold purple bg:0x86BBD8"
symbol = "λ "
version_format = "v$raw"

[helm]
detect_extensions = []
detect_files = ["helmfile.yaml","Chart.yaml"]
detect_folders = []
disabled = false
format = "[$symbol($version )]($style)"
style = "bold white"
symbol = "⎈ "
version_format = "v$raw"

[hg_branch]
disabled = true
format = "on [$symbol$branch]($style) "
style = "bold purple"
symbol = " "
truncation_length = 9223372036854775807
truncation_symbol = "…"

[hostname]
disabled = false
format = "[$ssh_symbol](blue dimmed bold)[$hostname]($style) "
ssh_only = false
style = "green dimmed bold"
trim_at = "."

[java]
detect_extensions = ["java","class","jar","gradle","clj","cljc"]
detect_files = ["pom.xml","build.gradle.kts","build.sbt",".java-version","deps.edn","project.clj","build.boot"]
detect_folders = []
disabled = false
format = "[$symbol($version )]($style)"
style = "red dimmed bg:0x86BBD8"
symbol = " "
version_format = "v$raw"

[jobs]
disabled = false
format = "[$symbol$number]($style) "
number_threshold = 2
style = "bold blue"
symbol = "✦"
symbol_threshold = 0
threshold = 1

[julia]
detect_extensions = ["jl"]
detect_files = ["Project.toml","Manifest.toml"]
detect_folders = []
disabled = false
format = "[$symbol($version )]($style)"
style = "bold purple bg:0x86BBD8"
symbol = " "
version_format = "v$raw"

[kotlin]
detect_extensions = ["kt","kts"]
detect_files = []
detect_folders = []
disabled = false
format = "[$symbol($version )]($style)"
kotlin_binary = "kotlin"
style = "bold blue"
symbol = "🅺 "
version_format = "v$raw"

[kubernetes]
context_aliases = {}
disabled = false
format = "[$symbol$context( ($namespace))]($style) in "
style = "cyan bold"
symbol = "⛵ "

[line_break]
disabled = false

[localip]
disabled = false
format = "[@$localipv4]($style) "
ssh_only = false
style = "yellow bold"

[lua]
detect_extensions = ["lua"]
detect_files = [".lua-version"]
detect_folders = ["lua"]
disabled = false
format = "[$symbol($version )]($style)"
lua_binary = "lua"
style = "bold blue"
symbol = "🌙 "
version_format = "v$raw"

[memory_usage]
disabled = false
format = "$symbol[$ram( | $swap)]($style) "
style = "white bold dimmed"
symbol = " "
threshold = -1

[nim]
detect_extensions = ["nim","nims","nimble"]
detect_files = ["nim.cfg"]
detect_folders = []
disabled = false
format = "[$symbol($version )]($style)"
style = "yellow bold bg:0x86BBD8"
symbol = " "
version_format = "v$raw"

[nix_shell]
disabled = false
format = "[$symbol]($style) "
impure_msg = "[impure](bold red)"
pure_msg = "[pure](bold green)"
style = "bold blue"
symbol = ""

[nodejs]
detect_extensions = ["js","mjs","cjs","ts","mts","cts"]
detect_files = ["package.json",".node-version",".nvmrc"]
detect_folders = ["node_modules"]
disabled = false
format = "[$symbol($version )]($style)"
not_capable_style = "bold red"
style = "bold green bg:0x86BBD8"
symbol = " "
version_format = "v$raw"

[ocaml]
detect_extensions = ["opam","ml","mli","re","rei"]
detect_files = ["dune","dune-project","jbuild","jbuild-ignore",".merlin"]
detect_folders = ["_opam","esy.lock"]
disabled = false
format = "[$symbol($version )(($switch_indicator$switch_name) )]($style)"
global_switch_indicator = ""
local_switch_indicator = "*"
style = "bold yellow"
symbol = "🐫 "
version_format = "v$raw"

[openstack]
disabled = false
format = "[$symbol$cloud(($project))]($style) "
style = "bold yellow"
symbol = "☁️  "

[package]
disabled = false
display_private = false
format = "[$symbol$version]($style) "
style = "208 bold"
symbol = "📦 "
version_format = "v$raw"

[perl]
detect_extensions = ["pl","pm","pod"]
detect_files = ["Makefile.PL","Build.PL","cpanfile","cpanfile.snapshot","META.json","META.yml",".perl-version"]
detect_folders = []
disabled = false
format = "[$symbol($version )]($style)"
style = "149 bold"
symbol = "🐪 "
version_format = "v$raw"

[php]
detect_extensions = ["php"]
detect_files = ["composer.json",".php-version"]
detect_folders = []
disabled = false
format = "[$symbol($version )]($style)"
style = "147 bold"
symbol = "🐘 "
version_format = "v$raw"

[pulumi]
disabled = false
format = "[$symbol($username@)$stack]($style) "
