tcsh_indicator = "tsh"
unknown_indicator = "mystery shell"
xonsh_indicator = "xsh"
zsh_indicator = "zsh"

[shlvl]
disabled = true
format = "[$symbol$shlvl]($style) "
repeat = false
style = "bold yellow"
symbol = "↕️  "
threshold = 2

[singularity]
disabled = false
format = "[$symbol[$env]]($style) "
style = "blue bold dimmed"
symbol = "📦 "

[spack]
disabled = false
format = "[$symbol$environment]($style) "
style = "blue bold"
symbol = "🅢 "
